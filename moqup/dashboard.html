<!doctype html>
<html lang="de" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Moqup Dashboard</title>
<!--
  Moqup — klickbarer Admin-Prototyp aus JSON.
  Parameter: map (Pflicht), colors, demo, logo, page. Dokumentation: DOCS.md
  Beispiel: dashboard.html#map=z:...&colors=...&demo=...&logo=...
  Styles unten — das gesamte Theme basiert auf CSS-Variablen (:root / [data-mode=light]); Logik — helper.js.
-->
<style>
/* ================= Palette (wird durch den Parameter colors überschrieben) ================= */
:root{
  --bg:#0a0f1f; --bg-2:#0e1428; --surface:#121a33; --surface-2:#1a2445; --border:rgba(148,163,255,.12);
  --text:#e8ecff; --muted:#8c97c2; --primary:#6c7cff; --primary-2:#a26bff; --primary-contrast:#fff; --accent:#22d3ee;
  --success:#22c55e; --warning:#f59e0b; --danger:#ef4444; --info:#38bdf8;
  --sidebar:#0b1124; --sidebar-text:#a9b3dc; --sidebar-active:rgba(108,124,255,.16); --topbar:rgba(10,15,31,.72); --logo-bg:linear-gradient(135deg,var(--primary),var(--primary-2));
  --c1:#6c7cff; --c2:#22d3ee; --c3:#a26bff; --c4:#22c55e; --c5:#f59e0b; --c6:#f472b6; --c7:#38bdf8; --c8:#ef4444;
  --radius:14px; --gap:16px; --sidebar-w:260px; --content-max:1680px;
  --shadow:0 8px 28px rgba(0,0,0,.28); --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-mode=light]{
  --bg:#f3f5fb; --bg-2:#eef1f8; --surface:#ffffff; --surface-2:#eef1f9; --border:rgba(20,30,70,.10);
  --text:#141a33; --muted:#66708f; --sidebar:#ffffff; --sidebar-text:#4b5577; --sidebar-active:rgba(108,124,255,.12);
  --topbar:rgba(255,255,255,.78); --shadow:0 6px 22px rgba(20,30,70,.08);
}

/* ================= Basis ================= */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.app-mode:not(.no-glow){background:
  radial-gradient(1100px 560px at 8% -12%,color-mix(in srgb,var(--primary) 16%,transparent),transparent 60%),
  radial-gradient(900px 500px at 110% 0%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
a{color:var(--primary);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.9em;background:color-mix(in srgb,var(--primary) 12%,transparent);padding:1px 6px;border-radius:6px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .spacer{flex:1}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 35%,transparent);border-radius:10px;border:2px solid transparent;background-clip:content-box}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.95)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--primary) 6%,transparent)}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tone) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}

/* ================= Ladebildschirm ================= */
.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:3000;transition:opacity .5s}
.loader.out{opacity:0;pointer-events:none}
.loader-box{width:min(420px,86vw);text-align:center}
.loader-ring{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;position:relative}
.loader-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--primary);border-right-color:var(--accent);animation:spin 1s linear infinite}
.loader-title{font-size:20px;font-weight:700;margin-bottom:16px}
.loader-bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.loader-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .12s;box-shadow:0 0 18px var(--primary)}
.loader-count{margin-top:12px;font-variant-numeric:tabular-nums;font-weight:600}
.loader-log{margin-top:4px;font:12px var(--mono);color:var(--muted);height:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ================= Dokumentation / Fehler ================= */
.docs-wrap{display:flex;justify-content:center;padding:48px 16px 80px}
.docs{width:min(980px,100%)}
.docs-hero{text-align:center;margin-bottom:24px}
.docs-hero h1{font-size:clamp(28px,4vw,40px);margin:12px 0 6px;background:linear-gradient(90deg,var(--text),var(--accent),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.docs-hero p{color:var(--muted);max-width:640px;margin:0 auto}
.docs-mark{width:64px;height:64px;margin:0 auto;border-radius:18px;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;background:var(--logo-bg);box-shadow:0 14px 40px color-mix(in srgb,var(--primary) 40%,transparent)}
.notice,.err{border-radius:14px;padding:16px 18px;margin:0 0 16px;animation:rise .4s}
.notice{border:1px solid color-mix(in srgb,var(--warning) 45%,transparent);background:color-mix(in srgb,var(--warning) 9%,transparent)}
.notice-title,.err-title{font-weight:700;font-size:16px;margin-bottom:6px}
.err{border:1px solid color-mix(in srgb,var(--danger) 50%,transparent);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.err-msg{font-family:var(--mono);font-size:13px;word-break:break-word}
.err-snippet,.b-status pre{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;overflow:auto;font:12.5px/1.5 var(--mono);margin:10px 0 0;white-space:pre}
.err-hints{margin:10px 0 0;padding-left:20px} .err-hints li{margin:3px 0}
.docs-tabs{display:flex;gap:6px;margin:22px 0 16px;border-bottom:1px solid var(--border);overflow-x:auto}
.docs-tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:600}
.docs-tabs button.on{color:var(--text);border-color:var(--primary)}
.md{line-height:1.65}
.md h1{font-size:28px;margin:8px 0 12px} .md h2{font-size:21px;margin:34px 0 10px;padding-top:12px;border-top:1px solid var(--border)} .md h3{font-size:16px;margin:22px 0 8px}
.md pre{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:14px;overflow:auto;font:12.5px/1.55 var(--mono)}
.md pre code{background:none;padding:0}
.md-table{overflow:auto;margin:10px 0} .md table{border-collapse:collapse;width:100%;font-size:13px}
.md th,.md td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top} .md th{background:var(--surface)}
.md blockquote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--primary);background:var(--surface);border-radius:0 10px 10px 0}
.md hr{border:0;border-top:1px solid var(--border);margin:24px 0}
.builder{display:flex;flex-direction:column;gap:12px}
.b-field{display:flex;flex-direction:column;gap:6px} .b-field .lbl{font-size:13px;color:var(--muted);font-weight:600}
.input.mono{font:12.5px/1.5 var(--mono)}
.b-more{border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:12px}
.b-more summary{cursor:pointer;font-weight:600;color:var(--muted)} .b-more[open] summary{margin-bottom:10px}
.b-more .b-field{margin-bottom:10px}
.b-actions{display:flex;gap:8px;flex-wrap:wrap}
.b-status .good{color:var(--success);font-size:13px} .b-status .bad{color:var(--danger);font-size:13px;margin:4px 0}
.examples{display:flex;flex-direction:column;gap:12px}
.ex-card{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);flex-wrap:wrap}
.ex-ico{font-size:30px} .ex-main{flex:1;min-width:220px} .ex-title{font-weight:700;font-size:16px} .ex-actions{display:flex;gap:8px}

/* ================= Grundgerüst ================= */
.shell{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:60;transition:width .25s,transform .25s}
.main{margin-left:var(--sidebar-w);min-width:0;min-height:100vh;display:flex;flex-direction:column;transition:margin .25s}
.brand{display:flex;gap:12px;align-items:center;padding:0 18px;height:64px;flex:none;border-bottom:1px solid var(--border)}
.brand-logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--logo-bg);color:#fff;font-weight:800;font-size:15px;flex:none;overflow:hidden;box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 35%,transparent)}
.brand-logo.img{background:var(--surface-2)} .brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-logo.big{width:64px;height:64px;border-radius:18px;font-size:24px}
.brand-text{min-width:0;overflow:hidden} .brand-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px}
.side-section{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:16px 10px 6px;white-space:nowrap;opacity:.8}
.side-link{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:0;background:none;color:var(--sidebar-text);cursor:pointer;text-align:left;position:relative;transition:background .15s,color .15s;margin:1px 0}
.side-link:hover{background:color-mix(in srgb,var(--sidebar-text) 9%,transparent);color:var(--text)}
.side-link.active{background:var(--sidebar-active);color:var(--text);font-weight:600}
.side-link.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--primary)}
.side-ico{width:22px;text-align:center;flex:none;font-size:16px}
.side-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-badge{font-size:11px;line-height:18px;padding:0 7px;border-radius:99px;background:var(--tone,var(--primary));color:#fff;font-weight:600}
.side-caret{transition:transform .2s;opacity:.6;font-size:16px}
.side-group.open>.side-link .side-caret{transform:rotate(90deg)}
.side-children{overflow:hidden;max-height:0;transition:max-height .3s ease;padding-left:12px;margin-left:10px;border-left:1px dashed var(--border)}
.side-group.open>.side-children{max-height:1200px}
.side-foot{padding:12px 14px;border-top:1px solid var(--border)}
.user-chip{display:flex;gap:10px;align-items:center} .uc-name{font-weight:600;font-size:13px;white-space:nowrap} .uc-role{font-size:12px;color:var(--muted);white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--primary));flex:none}
.avatar.sm{width:28px;height:28px;font-size:11px} .avatar.xs{width:22px;height:22px;font-size:9px}
.collapsed .sidebar{width:72px}
.collapsed .main{margin-left:72px}
.collapsed .side-label,.collapsed .side-badge,.collapsed .side-section,.collapsed .brand-text,.collapsed .side-caret,.collapsed .side-children{display:none}
.collapsed .side-link{justify-content:center}
.scrim{display:none}
@media(max-width:991px){
  .sidebar{transform:translateX(-102%);width:min(300px,86vw)!important;box-shadow:var(--shadow)}
  .main{margin-left:0!important}
  .side-open .sidebar{transform:none}
  .side-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;animation:fadein .2s}
  .collapsed .side-label,.collapsed .side-badge,.collapsed .side-section,.collapsed .brand-text,.collapsed .side-caret{display:initial}
}
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--topbar);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.top-crumbs{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;flex:none;font-size:15px;transition:background .15s}
.icon-btn:hover{background:var(--surface-2)}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.dot.bump{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.warn-btn{color:var(--warning)} .warn-btn .dot{background:var(--warning)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;text-align:left}
.search kbd{margin-left:auto;font:11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--border);background:var(--bg-2)}
.content{padding:24px;max-width:var(--content-max);width:100%;margin:0 auto;flex:1}
.footer{padding:16px 24px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);text-align:center}
@media(max-width:640px){
  .topbar{padding:0 12px;gap:6px}
  .search{flex:none;width:38px;padding:0;justify-content:center} .search span,.search kbd{display:none}
  .hide-sm{display:none!important}
  .top-crumbs{max-width:none;flex:1}
  .content{padding:16px 12px 90px}
}
.page{display:none} .page.active{display:block}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;animation:rise .4s}
.crumbs{font-size:12px;color:var(--muted)}
.page-title{font-size:26px;font-weight:750;margin:2px 0 2px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.pt-ico{font-size:.9em}
.page-sub{color:var(--muted);max-width:820px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:640px){.page-title{font-size:21px}}

/* ================= Raster ================= */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.cell{grid-column:span var(--w,12);min-width:0}
@media(max-width:1199px){.cell{grid-column:span var(--md,12)}}
@media(max-width:767px){.cell{grid-column:span var(--sm,12)}}
.page.active .cell{animation:rise .5s both;animation-delay:calc(var(--i,0) * 45ms)}
.compact{--gap:10px} .compact .card-body{padding:12px} .compact .card-head{padding:10px 12px}
.bare{height:100%}

/* ================= Karten und Buttons ================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;height:100%;min-width:0;overflow:hidden;transition:box-shadow .3s}
.card.toned{border-top:3px solid var(--tone)}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);min-height:52px}
.card-ico{font-size:18px}
.card-title{font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tools{display:flex;gap:4px;align-items:center;flex:none}
.card-body{padding:16px;flex:1;min-height:0;overflow:auto}
.card-body.flush{padding:0}
.card-foot{padding:10px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.card.collapsed .card-body,.card.collapsed .card-foot{display:none}
.card.collapsed{height:auto}
.card.max{position:fixed;inset:20px;z-index:400;height:auto;animation:pop .25s}
.max-back{position:fixed;inset:0;background:rgba(3,6,18,.6);z-index:399;backdrop-filter:blur(3px)}
.flash-ring{box-shadow:0 0 0 3px var(--primary),var(--shadow)!important;transition:box-shadow .3s}
.tool{border:0;background:none;color:var(--muted);cursor:pointer;min-width:28px;height:28px;border-radius:8px;font-size:14px;display:inline-grid;place-items:center}
.tool:hover{background:var(--surface-2);color:var(--text)} .tool.danger:hover{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-weight:550;white-space:nowrap;transition:transform .1s,filter .2s,background .2s,box-shadow .2s;text-decoration:none}
.btn:hover{filter:brightness(1.08);text-decoration:none} .btn:active{transform:scale(.97)} .btn[disabled]{opacity:.4;pointer-events:none}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent;color:var(--primary-contrast);box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 32%,transparent)}
.btn.success{background:var(--success);border-color:transparent;color:#fff}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.warning{background:var(--warning);border-color:transparent;color:#1b1300}
.btn.info{background:var(--info);border-color:transparent;color:#04121c}
.btn.ghost{background:transparent;border-color:transparent} .btn.ghost:hover{background:var(--surface-2)}
.btn.outline{background:transparent;border-color:var(--primary);color:var(--primary)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{height:48px;padding:0 24px;font-size:15px;border-radius:12px}
.btn.busy{pointer-events:none;opacity:.85}
.b-ico{font-size:1.05em}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .btn-row.center{justify-content:center}
.link-btn{border:0;background:none;color:var(--primary);cursor:pointer;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--tone,var(--muted));background:color-mix(in srgb,var(--tone,var(--muted)) 15%,transparent);white-space:nowrap;line-height:1.6}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none} .badge.plain::before{display:none}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap}
.chip:hover{color:var(--text)} .chip.on{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--text);border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--surface-2);font-size:12px;margin:1px 4px 1px 0;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}
.prose{line-height:1.65} .prose p{margin:0 0 8px}

/* ================= Stat ================= */
.stat{position:relative;padding:18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);height:100%;overflow:hidden;display:flex;flex-direction:column;gap:6px;transition:transform .2s,box-shadow .2s;isolation:isolate}
.stat::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tone) 22%,transparent),transparent 70%);z-index:-1}
.stat.clickable{cursor:pointer} .stat.clickable:hover{transform:translateY(-3px);box-shadow:0 14px 34px color-mix(in srgb,var(--tone) 22%,transparent)}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.s-main{min-width:0}
.s-label{color:var(--muted);font-size:13px;font-weight:500}
.s-value{font-size:28px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-icon{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--tone) 16%,transparent);color:var(--tone);flex:none}
.s-trend{font-size:12px;font-weight:600;color:var(--tone)} .s-trend .muted{font-weight:400}
.s-spark{width:100%;height:42px;margin-top:auto;display:block}
.s-bar{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:4px} .s-bar i{display:block;height:100%;background:var(--tone);border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

/* ================= Prozesse, Flow, Routen ================= */
.proc{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 4px}
.proc-step{flex:1;min-width:120px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 6px}
.proc-step.clickable{cursor:pointer}
.proc-node{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;background:var(--surface-2);border:2px solid var(--border);position:relative;z-index:1;transition:all .35s;color:var(--muted)}
.proc-step.done .proc-node{background:var(--success);border-color:var(--success);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--success) 35%,transparent)}
.proc-step.active .proc-node{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface));box-shadow:0 0 0 6px color-mix(in srgb,var(--primary) 18%,transparent);animation:pulse 1.6s infinite}
.proc-step.error .proc-node{background:var(--danger);border-color:var(--danger);color:#fff}
.proc-step:not(:last-child)::after{content:"";position:absolute;top:24px;left:calc(50% + 30px);right:calc(-50% + 30px);height:2px;background:var(--border);border-radius:2px}
.proc-step.done:not(:last-child)::after{background:var(--success)}
.proc-step.flow::after{background:repeating-linear-gradient(90deg,var(--primary) 0 8px,transparent 8px 14px)!important;background-size:28px 2px!important;animation:flowx .7s linear infinite}
@keyframes flowx{to{background-position:28px 0}}
.proc-text{margin-top:10px} .proc-title{font-weight:650;font-size:13px} .proc-desc{font-size:12px;color:var(--muted)} .proc-meta{margin-top:6px}
.proc.vertical{flex-direction:column;gap:16px}
@media(max-width:640px){
  .proc{flex-direction:column;gap:16px;overflow:visible}
  .proc-step{flex-direction:row;text-align:left;gap:12px;width:100%;align-items:flex-start;min-width:0;padding:0}
  .proc-text{margin-top:2px}
  .proc-step:not(:last-child)::after{top:52px;bottom:-14px;left:23px;right:auto;width:2px;height:auto}
  .proc-step.flow::after{background:repeating-linear-gradient(180deg,var(--primary) 0 8px,transparent 8px 14px)!important;background-size:2px 28px!important;animation:flowy .7s linear infinite}
}
.proc.vertical .proc-step{flex-direction:row;text-align:left;gap:12px;width:100%;align-items:flex-start;padding:0}
.proc.vertical .proc-text{margin-top:2px}
.proc.vertical .proc-step:not(:last-child)::after{top:52px;bottom:-14px;left:23px;right:auto;width:2px;height:auto}
@keyframes flowy{to{background-position:0 28px}}
.flow{position:relative;overflow-x:auto;overflow-y:hidden}
.flow-inner{position:relative}
.flow-svg{position:absolute;left:0;top:0;overflow:visible}
.flow-edge{fill:none;stroke:color-mix(in srgb,var(--muted) 55%,transparent);stroke-width:2}

.routes{position:relative;width:100%;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--primary) 8%,transparent),transparent 60%),var(--bg-2)}

.auto-head{display:flex;align-items:center;gap:12px}
.auto-main{flex:1;min-width:0} .auto-name{font-weight:650}
.auto-chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.auto-chip{padding:4px 10px;border-radius:8px;background:var(--surface-2);font-size:12px;border:1px solid var(--border);transition:all .25s}
.auto-chip.trigger{border-color:color-mix(in srgb,var(--warning) 55%,transparent);color:var(--warning)}
.auto-chip.cond{border-style:dashed}
.auto-chip.lit{background:var(--primary);color:#fff;border-color:transparent;transform:scale(1.07);box-shadow:0 0 18px color-mix(in srgb,var(--primary) 55%,transparent)}
.auto-chip.ok{border-color:color-mix(in srgb,var(--success) 60%,transparent)}
.auto-arrow{color:var(--muted);font-size:12px}

/* ================= Tabs, accordion, callout, heading ================= */
.tabs-nav{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;padding:0 8px}
.tab-btn{border:0;background:none;padding:12px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;font-weight:550}
.tab-btn:hover{color:var(--text)} .tab-btn.on{color:var(--text);border-color:var(--primary)}
.tab-pane{display:none;padding:16px} .tab-pane.on{display:block;animation:fadein .3s}
.tab-pane .card{box-shadow:none}
.acc-item{border-bottom:1px solid var(--border)} .acc-item:last-child{border-bottom:0}
.acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:0;background:none;cursor:pointer;font-weight:600;text-align:left}
.acc-caret{transition:transform .2s;font-size:18px;color:var(--muted)} .acc-item.open .acc-caret{transform:rotate(90deg)}
.acc-body{display:none;padding:0 16px 16px} .acc-item.open .acc-body{display:block;animation:fadein .3s}
.callout{border-radius:var(--radius);padding:14px 16px;border:1px solid color-mix(in srgb,var(--tone) 40%,transparent);background:color-mix(in srgb,var(--tone) 10%,transparent);display:flex;gap:12px;align-items:flex-start;height:100%}
.callout-ico{width:28px;height:28px;border-radius:50%;background:var(--tone);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.callout-main{flex:1;min-width:0} .callout-title{font-weight:700;margin-bottom:2px} .callout .btn-row{margin-top:10px}
.heading{padding:10px 0 0} .heading-title{font-size:18px;font-weight:700;display:flex;gap:8px;align-items:center}
.w-img{width:100%;display:block;border-radius:10px}

/* ================= Modals, Toasts, Menüs, Befehlspalette ================= */
.modal-back{position:fixed;inset:0;background:rgba(3,6,18,.62);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:500;padding:16px;animation:fadein .2s}
.modal-back.out{opacity:0;transition:opacity .18s}
.modal{width:min(var(--mw,560px),100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)} .modal-title{font-weight:700;font-size:16px;flex:1}
.modal-body{padding:18px;overflow:auto} .modal-text{margin-bottom:12px;line-height:1.6}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.warn-list{margin:0;padding-left:20px} .warn-list li{margin:6px 0;font-family:var(--mono);font-size:12.5px}
.toasts{position:fixed;top:76px;right:16px;z-index:2500;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;min-width:240px;max-width:380px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--tone);box-shadow:0 12px 30px rgba(0,0,0,.3);animation:slidein .35s cubic-bezier(.2,.9,.3,1.2);display:flex;gap:10px;align-items:flex-start;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateX(30px)}
.toast-ico{width:22px;height:22px;border-radius:50%;background:var(--tone);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.dropdown{position:absolute;top:calc(100% + 10px);right:0;width:340px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);z-index:70;overflow:hidden;animation:pop .18s;text-align:left;cursor:default}
.dd-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.dd-list{max-height:380px;overflow:auto}
.dd-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer} .dd-item:hover{background:var(--surface-2)}
.dd-item.unread{background:color-mix(in srgb,var(--primary) 6%,transparent)}
.dd-dot{width:8px;height:8px;border-radius:50%;background:var(--tone);margin-top:6px;flex:none}
.dd-time{font-size:11px;color:var(--muted)} .dd-empty{padding:24px;text-align:center;color:var(--muted)}
.palette-back{position:fixed;inset:0;background:rgba(3,6,18,.55);backdrop-filter:blur(4px);z-index:600;display:flex;justify-content:center;padding:12vh 16px 16px;animation:fadein .15s}
.palette{width:min(620px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;align-self:flex-start;animation:pop .2s}
.palette-input{height:54px;border:0;border-radius:0;border-bottom:1px solid var(--border);background:transparent;font-size:16px;padding:0 18px}
.palette-input:focus{box-shadow:none}
.palette-list{max-height:50vh;overflow:auto;padding:6px}
.palette-item{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}
.palette-item.on{background:color-mix(in srgb,var(--primary) 15%,transparent)}
.pi-ico{width:24px;text-align:center} .pi-title{flex:1;font-weight:550} .pi-sub{font-size:12px;color:var(--muted)}

/* ================= Chat ================= */
.chat-fab{position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:24px;box-shadow:0 14px 34px color-mix(in srgb,var(--primary) 45%,transparent);z-index:450;transition:transform .25s;display:grid;place-items:center}
.chat-fab::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid color-mix(in srgb,var(--primary) 50%,transparent);animation:ptp2 2.4s infinite}
@keyframes ptp2{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.chat-fab:hover{transform:scale(1.07)} .chat-fab.active{transform:rotate(90deg) scale(.92)} .chat-fab.active::before{display:none}
.chat-fab.left{right:auto;left:22px}
.chat-fab .dot{top:-2px;right:-2px}
.chat-panel{position:fixed;right:22px;bottom:94px;width:390px;max-width:calc(100vw - 24px);height:min(580px,calc(100vh - 124px));background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;z-index:450;transform-origin:bottom right;transition:transform .28s cubic-bezier(.2,.9,.3,1.15),opacity .2s;overflow:hidden}
.chat-panel.left{right:auto;left:22px;transform-origin:bottom left}
.chat-panel.closed{transform:scale(.85) translateY(20px);opacity:0;pointer-events:none}
.chat-head{display:flex;gap:10px;align-items:center;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 26%,transparent),color-mix(in srgb,var(--accent) 10%,transparent));border-bottom:1px solid var(--border)}
.avatar.ai{background:linear-gradient(135deg,var(--primary),var(--accent));font-size:16px}
.chat-who{flex:1} .chat-title{font-weight:700} .chat-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.chat-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 13px;border-radius:15px;font-size:13.5px;line-height:1.5;animation:rise .3s;word-wrap:break-word}
.msg.bot{background:var(--surface-2);border-bottom-left-radius:5px;align-self:flex-start}
.msg.user{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg.user code{background:rgba(255,255,255,.2)}
.msg-time{font-size:10px;opacity:.55;margin-top:3px;text-align:right}
.msg-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg .in-chat{margin-top:8px;box-shadow:none;height:auto} .msg .in-chat.stat{padding:12px}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite} .typing span:nth-child(2){animation-delay:.18s} .typing span:nth-child(3){animation-delay:.36s}
.chat-sugg{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;flex:none}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);flex:none}
.chat-input .btn{width:44px;padding:0}
@media(max-width:640px){
  .chat-panel{right:10px;left:10px;width:auto;max-width:none;bottom:86px;height:calc(100vh - 110px);height:calc(100dvh - 110px)}
  .chat-panel.left{left:10px}
  .chat-fab{right:14px;bottom:14px;width:56px;height:56px} .chat-fab.left{left:14px}
}

/* ================= Demo und Finale ================= */
.demo-cursor{position:fixed;left:-4px;top:-3px;width:28px;height:28px;z-index:4000;pointer-events:none;transition-property:transform;transition-timing-function:cubic-bezier(.45,.05,.2,1);filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));will-change:transform}
.demo-cursor svg{transition:transform .12s} .demo-cursor.press svg{transform:scale(.82)}
.demo-ripple{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--primary);background:color-mix(in srgb,var(--primary) 30%,transparent);z-index:3999;pointer-events:none;animation:ripple .6s forwards}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.demo-caption{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3900;width:max-content;max-width:min(760px,calc(100vw - 24px));background:rgba(8,12,28,.9);color:#fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px 14px 12px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.demo-caption.pop{animation:capPop .35s cubic-bezier(.2,1.4,.4,1)} @keyframes capPop{from{transform:translateX(-50%) scale(.96);opacity:.6}}
.dc-step{font:12px var(--mono);color:#9aa6d8;flex:none;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.08)}
.dc-text{font-size:15px;line-height:1.45;min-width:120px;transition:opacity .2s} .dc-text.dim{opacity:.55}
.dc-text code{background:rgba(255,255,255,.15)}
.dc-ctrl{display:flex;gap:4px;flex:none}
.dc-btn{width:32px;height:32px;border-radius:9px;border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer} .dc-btn:hover{background:rgba(255,255,255,.2)}
body.demo-on .chat-fab::before{display:none}
@media(max-width:640px){.demo-caption{bottom:12px;padding:10px;gap:8px}.dc-text{font-size:13px}body.demo-on .chat-fab{bottom:84px}.chat-fab.active{display:none}.chat-panel{bottom:10px;height:calc(100dvh - 20px)}}
.demo-spot{position:fixed;z-index:3800;border-radius:14px;box-shadow:0 0 0 9999px rgba(3,6,18,.58),0 0 0 3px var(--primary),0 0 40px var(--primary);pointer-events:none;animation:fadein .3s;transition:opacity .4s}
.demo-spot.out{opacity:0}
.finale{position:fixed;inset:0;z-index:4100;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--primary) 38%,#050816),#04060f 72%);color:#fff;animation:fadein .6s;padding:20px;text-align:center;overflow:hidden}
.finale.out{opacity:0;transition:opacity .45s}
.finale .confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4200}
.finale-orb{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.45;animation:orb 9s ease-in-out infinite alternate}
.finale-orb.a{background:var(--primary);left:-120px;top:-140px} .finale-orb.b{background:var(--accent);right:-140px;bottom:-160px;animation-delay:-4s}
@keyframes orb{to{transform:translate(80px,60px) scale(1.15)}}
.finale-box{position:relative;z-index:1;max-width:900px;animation:rise .8s cubic-bezier(.2,.9,.3,1.1)}
.finale-logo{display:flex;justify-content:center;margin-bottom:18px} .finale-logo .brand-logo{box-shadow:0 0 0 8px rgba(255,255,255,.06),0 20px 60px color-mix(in srgb,var(--primary) 60%,transparent)}
.finale h1{font-size:clamp(30px,5.5vw,62px);line-height:1.05;margin:0 0 12px;letter-spacing:-.03em;background:linear-gradient(90deg,#fff,var(--accent),var(--primary-2),#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.finale-text{font-size:clamp(15px,2vw,19px);color:rgba(255,255,255,.78);max-width:640px;margin:0 auto}
.finale-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:30px auto;max-width:780px}
.finale-stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 10px;animation:rise .6s both;backdrop-filter:blur(6px)}
.finale-stat b{display:block;font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--accent) 70%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.finale-stat span{font-size:13px;color:rgba(255,255,255,.7)}
.btn.ghost-light{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
